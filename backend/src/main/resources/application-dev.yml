# -----------------------------------------------------------------------------
# Dev profile — in-memory H2 database so `mvnw spring-boot:run` needs no
# local Postgres install. Change to a local Postgres URL when working on
# real persistence.
# -----------------------------------------------------------------------------

spring:
  datasource:
    url: jdbc:h2:mem:eazicut;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    # Flyway (see application.yml) is the schema authority in every profile.
    # Hibernate only validates that the entity model matches the migrated
    # schema — it never mutates the database.
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

eazicut:
  allowed-origins: http://localhost:3000
  # Dev-only admin bootstrap (B004). The in-memory spring.security.user
  # store used pre-B004 was retired — every environment now authenticates
  # against the real users table via JpaUserDetailsService, using the
  # PasswordEncoder bean in SecurityConfig.
  #
  # DevAdminSeeder ensures this account exists on every dev boot. Override
  # either value by exporting EAZICUT_DEV_ADMIN_EMAIL /
  # EAZICUT_DEV_ADMIN_PASSWORD before `mvnw spring-boot:run` if you want a
  # local instance with different credentials without editing this file.
  # Prod ignores this block entirely — the seeder is @Profile("dev").
  dev-admin:
    email: ${EAZICUT_DEV_ADMIN_EMAIL:admin@eazicut.local}
    password: ${EAZICUT_DEV_ADMIN_PASSWORD:admin}

logging:
  level:
    com.eazicut: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
